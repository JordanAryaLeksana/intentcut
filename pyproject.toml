[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "intentcut"
version = "0.1.0"
description = "IntentCut: local video rendering and media ingestion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.15,<5",
    "fastapi>=0.143,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.32,<1",
    "sqlalchemy>=2.1,<3",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
    "openai>=3.39.0",
]

[project.scripts]
intentcut-render = "intentcut.media.cli:main"
intentcut-init-db = "intentcut.backend.database:main"

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "integration: uses real external processes or PostgreSQL",
    "postgres: requires a dedicated TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
