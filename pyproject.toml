[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "intentcut"
version = "0.1.0"
description = "IntentCut M1A: deterministic local vertical video rendering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
intentcut-render = "intentcut.media.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = ["integration: requires local FFmpeg and FFprobe"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
