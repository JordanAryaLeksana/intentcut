services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: intentcut
      POSTGRES_DB: intentcut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentcut -d intentcut"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: intentcut
      POSTGRES_DB: intentcut_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentcut -d intentcut_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
